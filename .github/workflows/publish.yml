name: Publish to PyPI

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish
    if: github.repository == 'cognizant-ai-lab/leaf-common'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing

    steps:
      # v6.0.2
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Full history so setuptools-scm can derive the release version
          fetch-depth: 0
          persist-credentials: false

      - name: Build distributions
        # 1.0.11
        uses: cognizant-ai-lab/build-common/actions/build-python-dists@a70df67b0d623e56f34159de26c38989cd315d26
        with:
          python-version: '3.10'

      # pypa/gh-action-pypi-publish is a Docker action and must be called
      # directly from this workflow: PyPI Trusted Publishing matches the
      # job_workflow_ref claim against this file, and the action misresolves
      # its own image when nested inside a composite action.
      # v1.14.0
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b

      - name: Notify Slack
        if: ${{ !cancelled() }}
        # 1.0.11
        uses: cognizant-ai-lab/build-common/actions/slack-notify@a70df67b0d623e56f34159de26c38989cd315d26
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
